// --- build.gradle (Project: healthdatasync) ---

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

// Plugins block MUST come before 'ext'
plugins {
    id 'com.android.application' version '8.11.2' apply false
    id 'org.jetbrains.kotlin.jvm' version "2.1.0" apply false
    id 'org.jetbrains.kotlin.android' version "2.1.0" apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version "2.1.0" apply false

    id 'com.google.dagger.hilt.android' version "2.55" apply false
    id "com.google.devtools.ksp" version "2.1.0-1.0.29" apply false
    id 'org.jetbrains.kotlin.plugin.compose' version "2.1.0" apply false
    id 'com.google.gms.google-services' version '4.4.1' apply false
}

// Define global variables HERE (After plugins)
ext {
    kotlin_version = "2.1.0"
    compose_version = '1.5.4' // Legacy (not used by new plugin but kept for safety)
    wear_compose_version = '1.4.1'
    hilt_version = '2.55'
    ksp_version = '2.1.0-1.0.29'
}