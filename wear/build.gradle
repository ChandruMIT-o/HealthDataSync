plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose' // Requires Kotlin 2.0+
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.samsung.health.hrdatatransfer'
    compileSdk 35

    defaultConfig {
        applicationId "com.mhms.health.mobile"
        minSdk 30 // Wear OS 3.0 standard minimum
        targetSdk 34 // Stable target for Wear OS 4/5
        versionCode 1
        versionName "1.0"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // --- 1. Core Android & Kotlin ---
    implementation fileTree(dir: 'libs', include: '*.aar') // CRITICAL: Loads Samsung Health SDK
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'

    // --- 2. Serialization ---
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    // --- 3. UI: Jetpack Compose (Wear OS) ---
    // The BOM manages compatible versions for core compose libraries
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    // Lifecycle utilities
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation 'androidx.activity:activity-compose:1.10.0'

    // WEAR OS Specific UI (Material 3 is key for the new design)
    // Note: M3 for Wear is still in Alpha/RC but is the standard for new apps
    implementation "androidx.wear.compose:compose-material3:1.0.0-alpha30"
    implementation "androidx.wear.compose:compose-foundation:1.4.0"
    // Core icons (Required for Icons.Filled)
    implementation "androidx.compose.material:material-icons-core:1.7.6"
    // Extended icons (If you need rounded/outlined, but we will stick to core for safety)
    implementation "androidx.compose.material:material-icons-extended:1.7.6"

    // Navigation (Optional but good practice)
    implementation "androidx.wear.compose:compose-navigation:1.4.0"

    // --- 4. Background & Data Layer ---
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.1'
    implementation "androidx.wear:wear-ongoing:1.1.0" // For the "Ongoing Activity" icon

    // --- 5. Dependency Injection (Hilt) ---
    implementation "com.google.dagger:hilt-android:2.55"
    ksp "com.google.dagger:hilt-compiler:2.55"

    // --- 6. Utilities ---
    // Permissions handling in Compose
    implementation 'com.google.accompanist:accompanist-permissions:0.37.0'

    // Math (Keep if you are doing specific signal processing)
    implementation 'org.apache.commons:commons-math3:3.6.1'

    // --- 7. Testing ---
    testImplementation 'junit:junit:4.13.2'
    testImplementation "io.mockk:mockk:1.13.12"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1"

    // UI Tests
    androidTestImplementation platform('androidx.compose:compose-bom:2025.01.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}