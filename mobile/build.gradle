plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.samsung.health.mobile'
    compileSdk 36

    defaultConfig {
        applicationId "com.mhms.health.mobile"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }
    buildFeatures {
        compose true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(8))
        }
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    testBuildType "release"

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.0.21')
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    // compose
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation "androidx.compose.foundation:foundation:$compose_version"
    implementation "androidx.compose.runtime:runtime:$compose_version"
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0"
    // tests
    testImplementation 'junit:junit:4.13.2'
    // Wearable Data Layer
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation("androidx.navigation:navigation-compose:2.7.7")

    // EXTENDED ICONS (Fixes Icons.Rounded.VitalSigns, Analytics, etc.)
    implementation("androidx.compose.material:material-icons-extended:1.6.3")
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-database'
    implementation("com.google.firebase:firebase-firestore")

    // hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"

    // Standard Android Test libraries
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Compose Testing libraries
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"

    // Needed for running Compose tests; only included in debug builds
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_version"

    implementation 'com.github.wendykierp:JTransforms:3.1'

    implementation project(':common')
}
